[package]
name = "with-rust-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
dotenvy = "0.15.7"
openssl = "0.10.73"
postgres = "0.19.10"
postgres-openssl = "0.5.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"

[[bin]]
name = "create_table"
path = "src/create_table.rs"

[[bin]]
name = "read_data"
path = "src/read_data.rs"

[[bin]]
name = "update_data"
path = "src/update_data.rs"

[[bin]]
name = "delete_data"
path = "src/delete_data.rs"